# Testes do app a cada push e pull request (Linux, Node 22). Sem segredos: os testes nunca usam token real.
name: testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/
      - name: Nome sem import (eslint no-undef)
        run: npx -y eslint@9.15.0 js sw.js
